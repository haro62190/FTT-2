# Vérifie chaque modification avant qu'elle n'arrive sur le VPS :
# syntaxe de tous les fichiers + tests automatiques (commandes valides, logique, carte de rang…)
name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm test
